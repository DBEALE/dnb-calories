name = "calorie-extractor"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "calorie-tracker-sync"
database_id = "YOUR_DATABASE_ID_HERE"
# Run `wrangler d1 create calorie-tracker-sync` to get your database_id
# Run `wrangler d1 execute calorie-tracker-sync --file=schema.sql` to apply the schema